<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: blueviolet;
            color: blanchedalmond;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .square {
            height: 200px;
            width: 200px;
            background-color: red;
            border: 8px ridge black;
            color: black;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:0px 0px 15px rgb(239, 209, 37);
        }

        .rectangle {
            height: 200px;
            width: 400px;
            background-color: red;
            border: 8px ridge black;
            color: black;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:0px 0px 15px rgb(239, 209, 37);
        }

        .circle {
            height: 200px;
            width: 200px;
            background-color: red;
            border: 8px ridge black;
            border-radius: 50%;
            color: black;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:0px 0px 15px rgb(239, 209, 37);
        }

        .oval {
            height: 300px;
            width: 180px;
            background-color: red;
            border: 8px ridge black;
            border-radius: 50%;
            color: black;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:0px 0px 15px rgb(239, 209, 37);
        }

        .triangle {
            width: 200px;
            height: 200px;
            background-color: red;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: 8px ridge black;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow:0px 0px 15px rgb(239, 209, 37);
        }

        .diamond {
            height: 200px;
            width: 200px;
            background-color: red;
            border: 8px ridge black;
            color: black;
            font-size: 25px;
            font-weight: bold;
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(45deg);
            box-shadow:0px 0px 15px rgb(239, 209, 37);

        }

    </style>
</head>

<body>

    <div class="square"> SQUARE </div>
    <div class="rectangle"> RECTANGLE </div>
    <div class="circle"> CIRCLE </div>
    <div class="oval"> OVAL </div>
    <div class="triangle"> TRIANGLE </div>
    <div class="diamond"> DIAMOND </div>

</body>

</html>
