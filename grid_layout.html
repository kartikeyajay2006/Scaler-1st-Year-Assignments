<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(242, 238, 238);
        }

        .container {
            display: grid;
            height: 100vh;
            width: 100vw;
            gap: 20px;

        }

        .box {
            border: 6px solid black;
            cursor:pointer;
        }

        .box1 {
            grid-row: 1/4;
            grid-column: 1/2;
            background-color: pink;
            box-shadow: 0px 0px 20px rgb(219, 71, 95)
        }
        .box1:hover {
            transform: Scale(1.05);
        }

        .box2 {
            grid-column: 2/4;
            grid-row: 1/2;
            background-color: aqua;
            box-shadow: 0px 0px 20px rgb(110, 239, 239);
        }
        .box2:hover {
            transform: Scale(1.05);
        }

        .box3 {
            grid-column: 4/5;
            grid-row: 1/2;
            background-color: peru;
            box-shadow: 0px 0px 20px rgb(214, 120, 25);
        }
        .box3:hover {
            transform: Scale(1.05);
        }

        .box4 {
            grid-column: 2/3;
            grid-row: 2/3;
            background-color: green;
            box-shadow: 0px 0px 20px rgb(26, 255, 26);
        }
        .box4:hover {
            transform: Scale(1.05);
        }

        .box5 {
            grid-column: 3/4;
            grid-row: 2/3;
            background-color: yellow;
            box-shadow: 0px 0px 20px rgb(236, 236, 8);
        }
        .box5:hover {
            transform: Scale(1.05);
        }


        .box6 {
            grid-column: 4/5;
            grid-row: 2/4;
            background-color: orange;
            box-shadow: 0px 0px 20px rgb(206, 136, 6);
        }
        .box6:hover {
            transform: Scale(1.05);
        }

        .box7 {
            grid-column: 2/3;
            grid-row: 3/4;
            background-color: rgb(0, 4, 128);
            box-shadow: 0px 0px 20px rgb(18, 26, 246);
        }
        .box7:hover {
            transform: Scale(1.05);
        }

        main
        .box8 {
            grid-column: 3/4;
            grid-row: 3/4;
            background-color: rgb(238, 0, 255);
            box-shadow: 0px 0px 20px rgb(234, 44, 247);
        }
        .box8:hover {
            transform: Scale(1.05);
        }
        
    </style>
</head>

<body>
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        <div class="box box5"></div>
        <div class="box box6"></div>
        <div class="box box7"></div>
        <div class="box box8"></div>
    </div>
</body>

</html>
