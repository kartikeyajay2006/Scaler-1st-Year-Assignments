<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1><u><strong>Contact Form</strong></u></h1>
    <form>
        <label for="text"> Username:-
            <input type="username" id="un" placeholder="username" required><br><br>
        </label>
        <label for="email_id">Email-Id:-
            <input type="email" id="e-id" placeholder="EMAIL-Id" required>
        </label>
        <label for="password">Password:-
            <input type="Password" id="pass" placeholder="password" required><br><br>
        </label>
        <label for="Date_Of_Birth">Date-of-birth
            <input type="date" id="DOB">
        </label><br><br>
        <label for="gender">Gender:- <br>
            <input type="radio" id="male" name="gender" value="male"> Male
            <input type="radio" id="female" name="gender" value="female"> Female
        </label><br><br>
        <label for="state">Choose Your State:</label>
        <select id="state" name="state">
            <option value="">--Select State--</option>
            <option>Andhra Pradesh</option>
            <option>Arunachal Pradesh</option>
            <option>Assam</option>
            <option>Bihar</option>
            <option>Chhattisgarh</option>
            <option>Goa</option>
            <option>Gujarat</option>
            <option>Haryana</option>
            <option>Himachal Pradesh</option>
            <option>Jharkhand</option>
            <option>Karnataka</option>
            <option>Kerala</option>
            <option>Madhya Pradesh</option>
            <option>Maharashtra</option>
            <option>Manipur</option>
            <option>Meghalaya</option>
            <option>Mizoram</option>
            <option>Nagaland</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Rajasthan</option>
            <option>Sikkim</option>
            <option>Tamil Nadu</option>
            <option>Telangana</option>
            <option>Tripura</option>
            <option selected>Uttar Pradesh</option>
            <option>Uttarakhand</option>
            <option>West Bengal</option>
        </select><br><br>
        <label for="textarea">Submit Query:-
            <textarea id="textarea" rows="5" cols="30"></textarea>
        </label><br><br>
        <label for="submit">
            <input type="submit" id="submit">
        </label>
        <label for="reset">
            <input type="reset" id="reset">
        </label>

    </form>
</body>

</html>
